<html>
    <head>
        <title>"Readers' Haven - Book Registration & Order Form</title>
    </head>
    <body>
        <p>
            <h1>"Readers' Haven - Book Registration & Order Form</h1>
            <form>
                <label for="Customer Name">Customer Name</label>
                <input type="text" id="Customer Name" placeholder="Enter your Name" required>
                <br>
                <label for="Email Address">Email Address</label>
                <input type="text" id="Email Address" Placeholder="Enter your Email Address " required>
                <br>
                <label for="Mobile Number">Mobile Number</label>
                <input type="number" id="Mobile Number" placeholder="Enter your Mobile Number" required>
                <br>
                <label for="Age">Age</label>
                <input type="number" id="Age" placeholder="Enter your Age"required >
                <br>
                <label for="Password">Password</label>
                <input type="Password" id="Password" placeholder="Enter your Password" required>
                <br>
                <label>Delivery Date</label>
                <input type="date">
                <br>
                <label>Delivery Time</label>
                <input type="time">
                <br>
                <label required>Favorite Book Category</label>
                <select>
                <option>Fiction</option>
                <option>Science</option>
                <option>History</option>
                <option>Children's Books</option>
                </select>
                <br>
                <label for="Book Title">Book Title</label>
                <input type="text" id="Book Title" placeholder=" Enter Book Title" required>
                <br>
                <label for="Quantity">Quantity</label>
                <input type="number" id="Quantity" Placeholder="Enter Quality" min="2" required>
                <br>
                <label>Preferred Payment Method:-</label>
                <label>Cash on Delivery</label>
                <input type="radio" name="form">
                <label>Online payment</label>
                <input type="radio" name="form">
                <br>
                <label>Additional Services:-</label>
                <label>Gift Wrapping</label>
                <input type="checkbox">
                <label>Bookmark</label>
                <input type="checkbox">
                <label>Express Delivery</label>
                <input type="checkbox">
                <label>Greeting Card</label>
                <input type="checkbox">
                <br>
                <input type="hidden" value="Readers Heaven Book Order">
                <br>
                <label>File Upload</label>
                <input type="file" >
                <br>
                <label>Delivery Address</label>
                <textarea rows="5" col="30"></textarea>
                <br>
                <label>Special Instructions</label>
                <textarea rows="5" col="30"></textarea>
                <br>
                <button type="Submit">Submit</button>
                <br>
                <button type="Reset">Reset</button>


            </form>
        </p>
    </body>
</html>
