<html>
    <head>
        <title>Online Course Registration</title>
    </head>
    <body>
        <p>
            <h1>Online Course Registration</h1>
            <form>
                <label for="Student Name">Student Name</label>
                <input type="text" id="Student Name" placeholder="Enter Your Name" required>
                <br>
                <label for="Email Address">Email Address</label>
                <input type="text" id="Email Address" placeholder="Enter Your Email" required>
                <br>
                <label for="Mobile Number">Mobile Number</label>
                <input type="number" id="Mobile Number" placeholder="Enter Mobile Number" required>
                <br>
                <label for="Age">Age</label>
                <input type="number" id="Age" placeholder="Enter Your Age" required >
                <br>
                <label for="Password">Password</label>
                <br>
                <input type="Password" id="Password" placeholder="Enter Password" required>
                <br>
                <label>Gender:-</label>
                <label>Male</label>
                <input type="radio" name="form">
                <label>Female</label>
                <input type="radio" name="form">
                <label>Other</label>
                <input type="radio" name="form">
                <br>
                <label>Skills:-</label>
                <label>HTML</label>
                <input type="checkbox">
                <label>CSS</label>
                <input type="checkbox">
                <label>Java Script</label>
                <input type="checkbox">
                <label>Python</label>
                <input type="checkbox">
                <br>
                <label required>Course</label>
                <select>
                <option>Web Development</option>
                <option>Python Programming</option>
                <option>Data Analytics</option>
                <option>Python Programming</option>
                </select>
                <br>
                <input type="hidden" value="Online Course Registration">
                <br>
                <label>Date of Birth</label>
                <input type="date">
                <br>
                <label>Time</label>
                <input type="time">
                <br>
                <label>Address / Additional Information</label>
                <textarea rows="5" col="30"></textarea>
                <br>
                <label>Upload Document / Photograph</label>
                <input type="file" >
                <br>
                <input type="submit">
                <input type="reset">

                
            </form>
        </p>
    </body>
</html>
